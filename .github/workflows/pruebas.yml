# Pruebas rápidas en cada cambio: que en ningún nivel se pisen los botones, el globito del gato y el ejercicio.
name: Pruebas

on:
  push:
    branches: ["**"]
    paths: ["juego/**", "tests/**", "main.py", "requirements.txt", ".github/workflows/pruebas.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  pantalla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt skia-python
      - name: Que nada se pise en la pantalla
        run: python tests/test_superposicion.py 3
